---
apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod-resources3
spec:
  containers:
  - name: nginx-container
    image: nginx:1.26
    ports:
    - containerPort: 80
      protocol: TCP
    resources:
      requests:
        cpu: 200m
        memory: 250Mi
      limits:
        cpu: 1
        memory: 1Gi