---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cross-namespace-route
  namespace: team-a
spec:
  parentRefs:
    - name: lab-gateway
      namespace: gateway-system
      sectionName: http
  hostnames:
    - gw.lab.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /team-b
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /
      backendRefs:
        - name: team-b-web
          namespace: team-b
          port: 80
