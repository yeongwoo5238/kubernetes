---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: team-b-web
  namespace: team-b
spec:
  replicas: 2
  selector:
    matchLabels:
      app: team-b-web
  template:
    metadata:
      labels:
        app: team-b-web
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0.0
          args: ["-text=hello-from-team-b"]
          ports:
            - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: team-b-web
  namespace: team-b
spec:
  selector:
    app: team-b-web
  ports:
    - port: 80
      targetPort: 5678
