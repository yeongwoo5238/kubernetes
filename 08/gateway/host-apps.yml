apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-blue
  namespace: gateway-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-blue
  template:
    metadata:
      labels:
        app: web-blue
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0.0
          args: ["-text=hello-blue"]
          ports:
            - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: web-blue
  namespace: gateway-lab
spec:
  selector:
    app: web-blue
  ports:
    - port: 80
      targetPort: 5678
---
