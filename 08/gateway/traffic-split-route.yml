---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: traffic-split-route
  namespace: gateway-lab
spec:
  parentRefs:
    - name: lab-gateway
      namespace: gateway-system
      sectionName: http
  hostnames:
    - gw.lab.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /split
      backendRefs:
        - name: web-v1
          port: 80
          weight: 80
        - name: web-v2
          port: 80
          weight: 20
