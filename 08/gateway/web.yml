###################################################
# web: Service + Deployment
###################################################
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: gateway-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: hashicorp/http-echo:1.0.0
          args:
            - "-listen=:80"
            - "-text=main-gateway"
          ports:
            - containerPort: 80
              name: http
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: gateway-lab
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 80

###################################################
# web-app: Service + Deployment
###################################################
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: gateway-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
        - name: web-app
          image: hashicorp/http-echo:1.0.0
          args: ["-listen=:80", "-text=app-gateway"]
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: web-app
  namespace: gateway-lab
spec:
  selector:
    app: web-app
  ports:
    - port: 80
      targetPort: 80

