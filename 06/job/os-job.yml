---
kind: Job
apiVersion: batch/v1
metadata:
  name: os-job
spec:
  template:
    spec:
      containers:
      - name: os-container
        image: quay.io/centos/centos:stream10
        command: ["/bin/bash"]
        args:
        - "-c"
        - "echo HELL; sleep 60; echo WORLD"
      restartPolicy: Never