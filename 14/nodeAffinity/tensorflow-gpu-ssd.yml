---
apiVersion: v1
kind: Pod
metadata:
  name: tensorflow-gpu
spec:
  containers:
  - name: tensorflow
    image: tensorflow/tensorflow:nightly-jupyter
    ports:
    - containerPort: 8888
      protocol: TCP
  affinity:
    nodeAffinity:
      # [필수 조건] disk 레이블이 반드시 존재해야 함 (node1, node2 통과 / node3 탈락)
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: disk
            operator: Exists
      # [선호 조건] gpu=true(10점), disk=ssd(10점)
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 10
        preference:
          matchExpressions:
          - key: gpu
            operator: In
            values: ["true"]
      - weight: 10
        preference:
          matchExpressions:
          - key: disk
            operator: In
            values: ["ssd"]
